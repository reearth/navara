name: Security audit
on:
    push:
        branches:
            - main
        paths:
            - "**/Cargo.toml"
            - "**/pnpm-lock.yaml"
    pull_request:
        paths:
            - "**/Cargo.toml"
            - "**/pnpm-lock.yaml"
    schedule:
        - cron: "0 6 * * 1" # Weekly Monday 6am UTC

permissions:
    contents: read

jobs:
    cargo-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
              with:
                toolchain: 1.97.1

            - name: Install cargo-audit
              uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
              with:
                tool: cargo-audit
            - name: generate Cargo.lock
              run: cargo generate-lockfile
            - name: Run cargo audit
              run: cargo audit --file Cargo.lock

    pnpm-audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                run_install: false
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                node-version: '24.19.0'
            # --ignore-registry-errors: audit will fail only if the registry actually successfully responds with found vulnerabilities
            - run: pnpm audit --audit-level=high --ignore-registry-errors
