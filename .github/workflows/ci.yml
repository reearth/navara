name: Tests

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, rust-src

      # Cache Rust build artifacts and dependencies
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: "rust-deps"
          cache-on-failure: true
          # Cache cargo-make and wasm-pack binaries
          cache-all-crates: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: "pnpm"
          node-version: '24.19.0'

      - name: Install Tools (wasm-bindgen-cli, cargo-make)
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          tool: wasm-bindgen-cli@0.2.126, cargo-make

      - name: Prepare
        run: cargo make prepare-ci

      - name: Run Build Example
        run: pnpm build:example

      - name: Run Build library
        run: pnpm build

      - name: Build IIFE
        run: pnpm build:iife

      - name: Build Integration Tests
        run: pnpm build:integration

      - name: Run Test
        run: cargo make test
        env:
          RUST_BACKTRACE: 1

      - name: Cargo format
        run: cargo make format-check

      - name: Lint
        run: cargo make lint-check

  rust-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 2026-03-27
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: "rust-docs"

      - run: cargo test --doc
      - run: cargo doc --all-features --release
