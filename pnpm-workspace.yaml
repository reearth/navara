packages:
  - web/**
  - debug_tile_server
  - docs
allowBuilds:
  '@swc/core': false
  canvas: true
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: false

# Overrides to patch transitive dependencies flagged by `pnpm audit`.
# Each entry targets a specific vulnerable range so non-vulnerable majors
# (e.g. minimatch@3, picomatch@4 ≥ 4.0.4) keep their original versions.
# Replacement versions are exact pins (same policy as :pinVersions).
overrides:
  '@ungap/structured-clone@<1.3.1': 1.3.3
  defu@<6.1.5: 6.1.7
  devalue@>=5.6.3 <5.8.1: 5.9.0
  express-rate-limit@>=8.2.0 <8.2.2: 8.6.0
  fast-uri@<3.1.2: 4.1.2
  flatted@<3.4.2: 3.4.2
  minimatch@>=9.0.0 <9.0.7: 10.2.6
  path-to-regexp@>=8.0.0 <8.4.0: 8.4.2
  picomatch@<2.3.2: 4.0.5
  picomatch@>=4.0.0 <4.0.4: 4.0.5
  uuid@<11.1.1: 14.0.1
