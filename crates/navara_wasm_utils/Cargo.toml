[package]
name = "navara_wasm_utils"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Readable panic messages cost binary size; enable via each wasm crate's
# `debug` feature instead of shipping the hook in release builds.
default = []

[dependencies]
wasm-bindgen.workspace = true
console_error_panic_hook = { workspace = true, optional = true }
